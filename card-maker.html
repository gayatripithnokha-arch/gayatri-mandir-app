<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#8B0000"/>
<title>🎨 Canva Card Maker — गायत्री मंदिर</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--m:#8B0000;--s:#FF6600;--g:#D4A017;--cr:#FFF8F0;--ol:#FFF3E0;--font:'Noto Sans Devanagari',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:#1a1a2e;min-height:100vh;padding-bottom:70px;color:#fff;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--m),#5a0000);padding:10px 14px 7px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
.hdr-row{display:flex;align-items:center;justify-content:space-between;}
.hlogo{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff;padding:2px;}
.htitle{color:var(--g);font-weight:900;font-size:14px;}
.hsub{color:rgba(255,255,255,0.55);font-size:10px;}
.mswitch{display:flex;background:rgba(0,0,0,0.3);border-radius:24px;padding:3px;margin:6px 14px 4px;}
.mbtn{flex:1;padding:6px;border:none;border-radius:20px;font-family:var(--font);font-size:11px;font-weight:800;cursor:pointer;background:transparent;color:rgba(255,255,255,0.55);}
.mbtn.on{background:var(--g);color:var(--m);}

/* TOOLBAR */
.toolbar{background:rgba(0,0,0,0.4);padding:8px 12px;display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,0.1);}
.tool-btn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.8);cursor:pointer;font-family:var(--font);font-size:9px;font-weight:700;white-space:nowrap;min-width:52px;}
.tool-btn:active,.tool-btn.on{background:rgba(212,160,23,0.3);border-color:var(--g);color:var(--g);}
.tool-icon{font-size:18px;}

/* CANVAS AREA */
.canvas-wrap{position:relative;display:flex;justify-content:center;padding:10px 12px;overflow:hidden;}
#cv{border-radius:12px;display:block;touch-action:none;position:absolute;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;}
#cv.select-mode{cursor:default;}

/* ELEMENTS OVERLAY */
#bgDisplay{position:relative;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.5);overflow:hidden;cursor:crosshair;background:linear-gradient(135deg,#8B0000,#CC3300,#FF6600,#FFD700);}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;}
.el-wrap{position:absolute;pointer-events:all;touch-action:none;z-index:10;}
.el-wrap.selected .el-content{outline:2px solid var(--g);outline-offset:2px;}
.el-content{position:relative;display:inline-block;}
.el-text{color:#fff;font-family:var(--font);font-weight:700;text-shadow:2px 2px 6px rgba(0,0,0,0.8);white-space:nowrap;cursor:move;line-height:1.3;padding:2px 4px;}
.el-img{cursor:move;border-radius:4px;display:block;}
.el-img.circle{border-radius:50%;border:3px solid var(--g);}
.del-btn{position:absolute;top:-12px;right:-12px;width:22px;height:22px;background:#E63946;border-radius:50%;border:none;color:#fff;font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;font-weight:900;z-index:10;line-height:1;}
.el-wrap.selected .del-btn{display:flex;}
.resize-handle{position:absolute;bottom:-8px;right:-8px;width:16px;height:16px;background:var(--g);border-radius:50%;cursor:se-resize;display:none;z-index:10;}
.el-wrap.selected .resize-handle{display:block;}

/* PROPERTIES PANEL */
.props{background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.1);padding:10px 14px;display:none;}
.props.show{display:block;}
.props-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.prop-label{font-size:11px;color:rgba(255,255,255,0.6);font-weight:700;margin-right:2px;}
.prop-input{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);border-radius:7px;color:#fff;padding:5px 8px;font-size:12px;font-family:var(--font);outline:none;width:100%;}
.prop-input:focus{border-color:var(--g);}
.prop-btn{padding:6px 12px;border:none;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;font-family:var(--font);}
.swatch-row{display:flex;gap:5px;flex-wrap:wrap;}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.sw.on{border-color:#fff;transform:scale(1.2);}
.size-row{display:flex;gap:6px;align-items:center;}
.szb{width:28px;height:28px;border:1.5px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.08);font-size:15px;font-weight:800;cursor:pointer;color:#fff;font-family:var(--font);}
.szv{min-width:32px;text-align:center;font-weight:800;font-size:14px;color:var(--g);}
.align-row{display:flex;gap:5px;}
.align-btn{padding:5px 10px;border:1.5px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.07);color:#fff;font-size:11px;cursor:pointer;font-family:var(--font);font-weight:700;}
.align-btn:active{background:rgba(212,160,23,0.3);}

/* BG SECTION */
.bg-sect{padding:8px 12px;background:rgba(0,0,0,0.3);border-top:1px solid rgba(255,255,255,0.08);}
.bg-grid{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;}
.bgth{flex:none;width:55px;height:45px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;}
.bgth.on{border-color:var(--g);}
.bgth span{font-size:8px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.9);margin-bottom:2px;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0d0d1a;display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(255,255,255,0.1);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 4px 6px;border:none;background:transparent;color:rgba(255,255,255,0.4);cursor:pointer;font-family:var(--font);font-size:9px;gap:2px;}
.nb.on{color:var(--g);}
.ni{font-size:18px;}

.tst{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:16px;font-size:12px;z-index:999;font-family:var(--font);opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div style="display:flex;align-items:center;gap:8px">
      <img class="hlogo" id="hLogo"/>
      <div><div class="htitle">🎨 Smart Card Maker</div><div class="hsub">Photo & Text कहीं भी Add करें</div></div>
    </div>
    <button onclick="doDown()" style="background:var(--g);color:var(--m);border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:800;font-family:var(--font);cursor:pointer">⬇️ Save</button>
  </div>
  <div class="mswitch">
    <button class="mbtn on" onclick="setMode('card')">🖼️ Card (1:1)</button>
    <button class="mbtn" onclick="setMode('story')">📱 Story (9:16)</button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="tool-btn" onclick="addText()"><span class="tool-icon">✍️</span>Text Add</div>
  <div class="tool-btn" onclick="triggerPhotoAdd()"><span class="tool-icon">📸</span>Photo Add</div>
  <div class="tool-btn" onclick="addLogo()"><span class="tool-icon">🏛️</span>Logo Add</div>
  <div class="tool-btn" onclick="addSlogan()"><span class="tool-icon">✨</span>Slogan</div>
  <div class="tool-btn" onclick="addMandir()"><span class="tool-icon">🕉️</span>मंदिर नाम</div>
  <div class="tool-btn" onclick="addPhone()"><span class="tool-icon">📞</span>Phone</div>
  <div class="tool-btn" onclick="clearAll()"><span class="tool-icon">🗑️</span>सब हटाएं</div>
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="addPhotoFromFile(event)"/>
<input type="file" id="bgInput" accept="image/*" style="display:none" onchange="loadBgPhoto(event)"/>

<!-- CANVAS + OVERLAY -->
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="cv"></canvas>
  <div id="bgDisplay" onclick="canvasClick(event)"></div>
  <div id="overlay"></div>
</div>

<!-- PROPERTIES PANEL -->
<div class="props" id="propsPanel">
  <div id="textProps" style="display:none">
    <div class="props-row">
      <input class="prop-input" id="textEdit" placeholder="Text लिखें..." oninput="updateSelectedText(this.value)" style="flex:1"/>
    </div>
    <div class="props-row">
      <span class="prop-label">रंग:</span>
      <div class="swatch-row" id="colorSwatches"></div>
    </div>
    <div class="props-row">
      <span class="prop-label">Size:</span>
      <div class="size-row">
        <button class="szb" onclick="chFontSize(-2)">−</button>
        <span class="szv" id="fontSizeVal">36</span>
        <button class="szb" onclick="chFontSize(2)">+</button>
      </div>
      <span class="prop-label" style="margin-left:10px">Style:</span>
      <button class="prop-btn" style="background:rgba(255,255,255,0.1);color:#fff" onclick="toggleBold()">𝐁 Bold</button>
    </div>
    <div class="props-row">
      <span class="prop-label">Align:</span>
      <div class="align-row">
        <button class="align-btn" onclick="setAlign('left')">←</button>
        <button class="align-btn" onclick="setAlign('center')">↔</button>
        <button class="align-btn" onclick="setAlign('right')">→</button>
      </div>
    </div>
  </div>
  <div id="imgProps" style="display:none">
    <div class="props-row">
      <span class="prop-label">Size:</span>
      <div class="size-row">
        <button class="szb" onclick="chImgSize(-20)">−</button>
        <span class="szv" id="imgSizeVal">120</span>
        <button class="szb" onclick="chImgSize(20)">+</button>
      </div>
      <button class="prop-btn" style="background:rgba(255,255,255,0.1);color:#fff;margin-left:8px" onclick="toggleCircle()">⭕ Circle</button>
    </div>
    <div class="props-row">
      <button class="prop-btn" style="background:rgba(255,215,0,0.2);color:var(--g);border:1px solid var(--g)" onclick="bringForward()">⬆️ ऊपर</button>
      <button class="prop-btn" style="background:rgba(255,255,255,0.1);color:#fff;margin-left:6px" onclick="sendBackward()">⬇️ नीचे</button>
    </div>
  </div>
</div>

<!-- BG SECTION -->
<div class="bg-sect">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <span style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.7)">🎨 Background:</span>
    <div style="display:flex;gap:6px">
      <button onclick="triggerBgAdd()" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:7px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer;font-family:var(--font)">📸 Photo</button>
      <button onclick="doShare()" style="background:#25D366;color:#fff;border:none;border-radius:7px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer;font-family:var(--font)">💬 WA</button>
    </div>
  </div>
  <div class="bg-grid" id="bgGrid"></div>
</div>

<nav class="bnav">
  <button class="nb on" id="nb0" onclick="setNavTab(0,this)"><span class="ni">✍️</span><span>Edit</span></button>
  <button class="nb" id="nb1" onclick="setNavTab(1,this)"><span class="ni">📋</span><span>Template</span></button>
  <button class="nb" id="nb2" onclick="setNavTab(2,this)"><span class="ni">📤</span><span>Share</span></button>
</nav>

<div id="tplPanel" style="display:none;padding:10px 12px;background:rgba(0,0,0,0.5)">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px" id="tplGrid"></div>
</div>
<div id="sharePanel" style="display:none;padding:10px 12px;background:rgba(0,0,0,0.5)">
  <button onclick="doDown()" style="width:100%;background:var(--m);color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;font-family:var(--font);cursor:pointer;margin-bottom:8px">⬇️ Image Download</button>
  <button onclick="doShare()" style="width:100%;background:#25D366;color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;font-family:var(--font);cursor:pointer;margin-bottom:8px">💬 WhatsApp Share</button>
  <button onclick="doCopy()" style="width:100%;background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;font-family:var(--font);cursor:pointer">📋 Image Copy</button>
</div>

<div class="tst" id="tst"></div>

// ============ OVERLAY ============
function renderOverlay(){
  var ov=document.getElementById("overlay");
  var sorted=elements.slice().sort(function(a,b){return a.zIndex-b.zIndex;});
  ov.innerHTML="";
  sorted.forEach(function(el){
    var wrap=document.createElement("div");
    wrap.className="el-wrap"+(el.id===selectedId?" selected":"");
    wrap.id="wrap_"+el.id;
    wrap.style.left=(el.x*displayScale)+"px";
    wrap.style.top=(el.y*displayScale)+"px";
    wrap.style.width=(el.w*displayScale)+"px";

    var content=document.createElement("div");
    content.className="el-content";

    if(el.type==="text"){
      var div=document.createElement("div");
      div.className="el-text";
      div.style.fontSize=(el.fontSize*displayScale)+"px";
      div.style.color=el.color;
      div.style.fontWeight=el.bold?"800":"600";
      div.style.textAlign=el.align||"center";
      div.style.width=(el.w*displayScale)+"px";
      div.style.wordBreak="break-word";
      div.style.whiteSpace="pre-wrap";
      div.textContent=el.text;
      content.appendChild(div);
    } else if(el.type==="img"){
      var img=document.createElement("img");
      img.className="el-img"+(el.circle?" circle":"");
      img.style.width=(el.w*displayScale)+"px";
      img.style.height=(el.w*displayScale)+"px";
      img.style.objectFit="cover";
      img.src=el.img.src;
      content.appendChild(img);
    }

    wrap.appendChild(content);

    // Delete button
    var del=document.createElement("button");
    del.className="del-btn";del.innerHTML="✕";
    del.onclick=function(e){e.stopPropagation();deleteEl(el.id);};
    wrap.appendChild(del);

    // Resize handle
    var rh=document.createElement("div");
    rh.className="resize-handle";
    wrap.appendChild(rh);

    // Touch/Mouse events
    wrap.addEventListener("touchstart",function(e){onElTouchStart(e,el.id);},{passive:false});
    wrap.addEventListener("mousedown",function(e){onElMouseDown(e,el.id);});
    rh.addEventListener("touchstart",function(e){onResizeTouchStart(e,el.id);},{passive:false});
    rh.addEventListener("mousedown",function(e){onResizeMouseDown(e,el.id);});

    ov.appendChild(wrap);
  });
}

// ============ DRAG ============
function onElTouchStart(e,id){
  e.stopPropagation();
  if(e.target.classList.contains("resize-handle")) return;
  selectEl(id);
  var t=e.touches[0];
  var wrap=document.getElementById("wrap_"+id);
  var rect=wrap.getBoundingClientRect();
  dragOffX=(t.clientX-rect.left)/displayScale;
  dragOffY=(t.clientY-rect.top)/displayScale;
  isDragging=true; dragElId=id;
  document.addEventListener("touchmove",onTouchMove,{passive:false});
  document.addEventListener("touchend",onTouchEnd);
}

function onElMouseDown(e,id){
  e.stopPropagation();
  if(e.target.classList.contains("resize-handle")) return;
  selectEl(id);
  var wrap=document.getElementById("wrap_"+id);
  var rect=wrap.getBoundingClientRect();
  dragOffX=(e.clientX-rect.left)/displayScale;
  dragOffY=(e.clientY-rect.top)/displayScale;
  isDragging=true; dragElId=id;
  document.addEventListener("mousemove",onMouseMove);
  document.addEventListener("mouseup",onMouseUp);
}

function onTouchMove(e){
  e.preventDefault();
  if(isDragging&&dragElId){
    var t=e.touches[0];
    var ov=document.getElementById("overlay");
    var ovRect=ov.getBoundingClientRect();
    var nx=(t.clientX-ovRect.left)/displayScale-dragOffX;
    var ny=(t.clientY-ovRect.top)/displayScale-dragOffY;
    moveEl(dragElId,nx,ny);
  }
  if(isResizing&&resizeElId){
    var t=e.touches[0];
    var dx=t.clientX-resizeStartX;
    var dy=t.clientY-resizeStartY;
    var nw=Math.max(40,resizeStartW+dx/displayScale);
    resizeEl(resizeElId,nw);
  }
}

function onMouseMove(e){
  if(isDragging&&dragElId){
    var ov=document.getElementById("overlay");
    var ovRect=ov.getBoundingClientRect();
    var nx=(e.clientX-ovRect.left)/displayScale-dragOffX;
    var ny=(e.clientY-ovRect.top)/displayScale-dragOffY;
    moveEl(dragElId,nx,ny);
  }
  if(isResizing&&resizeElId){
    var dx=e.clientX-resizeStartX;
    var nw=Math.max(40,resizeStartW+dx/displayScale);
    resizeEl(resizeElId,nw);
  }
}

function onTouchEnd(){isDragging=false;isResizing=false;dragElId=null;resizeElId=null;document.removeEventListener("touchmove",onTouchMove);document.removeEventListener("touchend",onTouchEnd);}
function onMouseUp(){isDragging=false;isResizing=false;dragElId=null;resizeElId=null;document.removeEventListener("mousemove",onMouseMove);document.removeEventListener("mouseup",onMouseUp);}

function moveEl(id,nx,ny){
  var el=getEl(id); if(!el) return;
  el.x=Math.max(-50,Math.min(CVW-50,nx));
  el.y=Math.max(-20,Math.min(CVH-20,ny));
  var wrap=document.getElementById("wrap_"+id);
  if(wrap){wrap.style.left=(el.x*displayScale)+"px";wrap.style.top=(el.y*displayScale)+"px";}
  drawCanvas();
}

// ============ RESIZE ============
function onResizeTouchStart(e,id){
  e.stopPropagation();e.preventDefault();
  isResizing=true;resizeElId=id;
  var t=e.touches[0];
  resizeStartX=t.clientX;resizeStartY=t.clientY;
  var el=getEl(id);
  resizeStartW=el?el.w:100;
  document.addEventListener("touchmove",onTouchMove,{passive:false});
  document.addEventListener("touchend",onTouchEnd);
}
function onResizeMouseDown(e,id){
  e.stopPropagation();e.preventDefault();
  isResizing=true;resizeElId=id;
  resizeStartX=e.clientX;resizeStartY=e.clientY;
  var el=getEl(id);
  resizeStartW=el?el.w:100;
  document.addEventListener("mousemove",onMouseMove);
  document.addEventListener("mouseup",onMouseUp);
}
function resizeEl(id,nw){
  var el=getEl(id); if(!el) return;
  el.w=nw; el.h=nw;
  var wrap=document.getElementById("wrap_"+id);
  if(wrap){
    wrap.style.width=(nw*displayScale)+"px";
    var img=wrap.querySelector(".el-img");
    if(img){img.style.width=(nw*displayScale)+"px";img.style.height=(nw*displayScale)+"px";}
    var txt=wrap.querySelector(".el-text");
    if(txt) txt.style.width=(nw*displayScale)+"px";
    var szEl=document.getElementById("imgSizeVal");
    if(szEl) szEl.textContent=Math.round(nw);
  }
  drawCanvas();
}

function updateBgDisplay(){
  var bg=document.getElementById("bgDisplay"); if(!bg) return;
  var BGS_=BGS;
  if(bgIdx===-1&&bgCustom){
    bg.style.backgroundImage="url('"+bgCustom.src+"')";
    bg.style.backgroundSize="cover";bg.style.backgroundPosition="center";
    bg.style.backgroundColor="";
  } else {
    var b=BGS_[Math.max(0,bgIdx)]||BGS_[0];
    bg.style.backgroundImage="linear-gradient(135deg,"+b.c.join(",")+")";
    bg.style.backgroundSize="";bg.style.backgroundPosition="";
    bg.style.backgroundColor="";
  }
  // Border overlay via pseudo - use box-shadow trick
  bg.style.boxShadow="inset 0 0 0 4px rgba(255,215,0,0.6), inset 0 0 0 8px rgba(255,150,0,0.2), 0 4px 24px rgba(0,0,0,0.5)";

}

      :bg.t==="s"?"background:linear-gradient(135deg,#BF953F,#FCF6BA,#B38728)"
      :bg.t==="d"?"background:linear-gradient(135deg,#1a0533,#4A0080,#FF6600)"
      :bg.t==="f"?"background:linear-gradient(135deg,#FF758C,#FF7EB3,#FFB347)"
      :bg.t==="m"?"background:linear-gradient(135deg,#8B0000,#CC3300,#FFD700)"

    return '<div class="bgth'+(i===bgIdx?" on":"")+'" style="'+s+'" id="bgt_'+i+'"><span>'+bg.l+"</span></div>";
  }).join("");
  grid.querySelectorAll(".bgth").forEach(function(el,i){
    el.onclick=function(){selBg(i);};
  });

  addText("धियो यो नः प्रचोदयात्।",CVW/2-210,500,"#FFFFFF",44,false);
  addText("— गायत्री मंत्र",CVW/2-130,590,"#FFD700",34,false);
  addMandir();
  renderOverlay();drawCanvas();
}

// ============ CANVAS DRAW ============
function drawCanvas(){
  var cv=document.getElementById("cv");
  if(!cv) return;
  var ctx=cv.getContext("2d");
  var W=CVW,H=CVH;
  // BG
  if(bgIdx===-1&&bgCustom){
    var sc=Math.max(W/bgCustom.width,H/bgCustom.height);
    ctx.drawImage(bgCustom,(W-bgCustom.width*sc)/2,(H-bgCustom.height*sc)/2,bgCustom.width*sc,bgCustom.height*sc);
  } else {
    var bg=BGS[Math.max(0,bgIdx)]||BGS[0];
    var g=ctx.createLinearGradient(0,0,W,H);
    bg.c.forEach(function(c,i){g.addColorStop(i/(bg.c.length-1),c);});
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(bg.t==="d"){
      for(var i=0;i<50;i++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H*0.5,Math.random()*2+0.5,0,Math.PI*2);ctx.fillStyle="rgba(255,255,200,0.3)";ctx.fill();}
    }
    if(bg.t==="f"){
      [[80,80],[W-80,80],[80,H-80],[W-80,H-80],[W/2,60],[W/2,H-60]].forEach(function(p){
        for(var j=0;j<6;j++){var a=(j/6)*Math.PI*2;ctx.beginPath();ctx.ellipse(p[0]+Math.cos(a)*22,p[1]+Math.sin(a)*22,13,7,a,0,Math.PI*2);ctx.fillStyle="rgba(255,182,193,0.4)";ctx.fill();}
        ctx.beginPath();ctx.arc(p[0],p[1],11,0,Math.PI*2);ctx.fillStyle="rgba(255,220,50,0.65)";ctx.fill();
      });
    }
    if(bg.t==="m"){
      ctx.font="bold 22px serif";ctx.fillStyle="rgba(255,215,0,0.07)";ctx.textAlign="center";
      var ms=["ॐ","🕉️","श्री","माँ","🙏"];
      for(var r=0;r<10;r++) for(var c=0;c<4;c++) ctx.fillText(ms[(r+c)%ms.length],c*(W/3)+W/6,r*(H/9)+80);
    }
  }
  // Overlay = 0
  ctx.fillStyle="rgba(0,0,0,0.18)";ctx.fillRect(0,0,W,H);
  // Border
  [22,36].forEach(function(m,idx){
    ctx.strokeStyle=idx===0?"rgba(255,215,0,0.6)":"rgba(255,150,0,0.22)";
    ctx.lineWidth=idx===0?4:2;var r=15;
    ctx.beginPath();ctx.moveTo(m+r,m);ctx.lineTo(W-m-r,m);ctx.quadraticCurveTo(W-m,m,W-m,m+r);
    ctx.lineTo(W-m,H-m-r);ctx.quadraticCurveTo(W-m,H-m,W-m-r,H-m);
    ctx.lineTo(m+r,H-m);ctx.quadraticCurveTo(m,H-m,m,H-m-r);
    ctx.lineTo(m,m+r);ctx.quadraticCurveTo(m,m,m+r,m);ctx.closePath();ctx.stroke();
  });
  ctx.font="28px serif";ctx.textAlign="center";ctx.fillStyle="rgba(255,215,0,0.45)";
  [[55,55],[W-55,55],[55,H-55],[W-55,H-55]].forEach(function(p){ctx.fillText("✦",p[0],p[1]+9);});
  // Draw elements
  var sorted=elements.slice().sort(function(a,b){return a.zIndex-b.zIndex;});
  sorted.forEach(function(el){
    if(el.type==="text"){
      ctx.save();
      if(true){ctx.shadowColor="rgba(0,0,0,0.85)";ctx.shadowBlur=18;ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;}
      ctx.fillStyle=el.color;
      ctx.font=(el.bold?"800":"600")+" "+el.fontSize+"px 'Noto Sans Devanagari',sans-serif";
      ctx.textAlign=el.align||"left";
      var tx=el.align==="center"?(el.x+el.w/2):el.align==="right"?(el.x+el.w):el.x;
      var lines=el.text.split("\n");
      lines.forEach(function(l,li){ctx.fillText(l,tx,el.y+el.fontSize*1.1+(li*el.fontSize*1.4));});
      ctx.restore();
    } else if(el.type==="img"&&el.img&&el.img.complete&&el.img.naturalWidth){
      ctx.save();
      if(el.circle){
        ctx.beginPath();ctx.arc(el.x+el.w/2,el.y+el.h/2,el.w/2,0,Math.PI*2);ctx.clip();
      }
      ctx.drawImage(el.img,el.x,el.y,el.w,el.h);
      ctx.restore();
      if(el.circle){
        ctx.beginPath();ctx.arc(el.x+el.w/2,el.y+el.h/2,el.w/2+3,0,Math.PI*2);
        ctx.strokeStyle="rgba(255,215,0,0.85)";ctx.lineWidth=5;ctx.stroke();
      }
    }
  });
}

// ============ NAV TABS ============
function setNavTab(idx,btn){
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
  document.getElementById("tplPanel").style.display=idx===1?"block":"none";
  document.getElementById("sharePanel").style.display=idx===2?"block":"none";
}

// ============ SHARE ============
function finalDraw(){
  deselectAll();
  // Make canvas visible for capture
  var cv=document.getElementById("cv");
  cv.style.opacity="1";
  cv.style.zIndex="999";
  drawCanvas();
}

function afterDraw(){
  var cv=document.getElementById("cv");
  cv.style.opacity="0";
  cv.style.zIndex="-1";
}

function doDown(){
  finalDraw();
  setTimeout(function(){
    var a=document.createElement("a");
    a.download="gayatri_card_"+Date.now()+".png";
    a.href=document.getElementById("cv").toDataURL("image/png");
    a.click();
    afterDraw();
    toast("✅ Download हुई!");
  },200);
}

function doShare(){
  finalDraw();
  setTimeout(function(){
    document.getElementById("cv").toBlob(function(blob){
      afterDraw();
      if(navigator.share){
        var file=new File([blob],"gayatri_card.png",{type:"image/png"});
        navigator.share({files:[file],title:MANDIR}).catch(function(){doDown();});
      } else doDown();
    },"image/png");
  },200);
}

function doCopy(){
  finalDraw();
  setTimeout(function(){
    document.getElementById("cv").toBlob(function(blob){
      if(navigator.clipboard&&navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(function(){toast("✅ Copy हुई!");}).catch(function(){doDown();});
      } else doDown();
    },"image/png");
  },100);
}

function toast(msg){var t=document.getElementById("tst");t.textContent=msg;t.style.opacity="1";setTimeout(function(){t.style.opacity="0";},2500);}

// INIT
window.addEventListener("resize",function(){setupCanvas();});
init();
</script></body></html>
